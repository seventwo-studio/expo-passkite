name: Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: linux-amd64
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run build:types

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Verify package contents
        run: npm pack --dry-run

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: linux-amd64
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Setup Node for Gitea Packages
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: ${{ github.server_url }}/api/packages/seventwo-studio/npm/
          always-auth: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Publish missing version to Gitea Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITEA_TOKEN }}
          REGISTRY_URL: ${{ github.server_url }}/api/packages/seventwo-studio/npm/
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          view_error="${RUNNER_TEMP:-/tmp}/expo-passkite-npm-view-error.log"

          if published_version="$(
            npm view "${package_name}@${package_version}" version \
              --registry "$REGISTRY_URL" \
              2>"$view_error"
          )"; then
            test "$published_version" = "$package_version"
            echo "${package_name}@${package_version} already exists in Gitea Packages."
          elif grep --quiet 'E404' "$view_error"; then
            npm publish --registry "$REGISTRY_URL"
          else
            cat "$view_error" >&2
            exit 1
          fi
